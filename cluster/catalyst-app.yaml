apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: catalyst
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://github.com/aaronkyriesenbach/catalyst
        targetRevision: HEAD
        path: .
    destination:
        server: https://kubernetes.default.svc
        namespace: default
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        retry:
            limit: 5
            backoff:
                duration: 30s
                factor: 2
                maxDuration: 5m
