---
kyoo:
  address: https://kyoo.int.lab53.net
  # The scanner reaches the API through the cluster Traefik, which exchanges its
  # API key for a JWT.
  middlewareRootURL: https://kyoo.int.lab53.net
  oidc_providers:
    # The endpoint addresses are set in apps/kyoo.ts so they follow
    # authentik's hostname.
    - name: authentik
      existingSecret: kyoo-oidc-credentials
      clientIdKey: client_id
      clientSecretKey: client_secret
      logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons\
        /webp/authentik.webp"
      scope: openid email profile
      authMethod: ClientSecretPost
  auth:
    apikeys:
      scanner:
        existingSecret: kyoo-apikeys

global:
  postgres:
    shared:
      host: kyoo-postgres
      databaseOverride: kyoo
      userOverride: kyoo
      passwordOverride: kyoo
      sslmodeOverride: disable

media:
  volumes:
    - name: media
      nfs:
        server: 192.168.53.120
        path: /mnt/tank/data
  volumeMounts:
    - name: media
      mountPath: /media/movies
      subPath: media/movies
      readOnly: true
    - name: media
      mountPath: /media/tv
      subPath: media/tv
      readOnly: true
  baseMountPath: /media

api:
  replicaCount: 0
  kyoo_api:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
  persistence:
    storageClass: truenas-iscsi
    size: 10Gi
auth:
  replicaCount: 0
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  kyoo_auth:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  # RWO profile-picture PVC: a surge pod on the other node can't attach it.
  updateStrategy:
    type: Recreate
  persistence:
    storageClass: truenas-iscsi
transcoder:
  replicaCount: 0
  kyoo_transcoder:
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: "2"
        memory: 1Gi
  persistence:
    storageClass: truenas-iscsi

front:
  replicaCount: 0
  kyoo_front:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 128Mi
scanner:
  replicaCount: 0
  kyoo_scanner:
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 768Mi

traefikproxy:
  enabled: false
