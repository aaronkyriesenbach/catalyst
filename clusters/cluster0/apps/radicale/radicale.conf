[server]
hosts = 0.0.0.0:5232

[auth]
type = htpasswd
htpasswd_filename = /radicale/etc/users
htpasswd_encryption = bcrypt

[storage]
type = multifilesystem_nolock
filesystem_folder = /radicale/var

[web]
type = none

[headers]
# Calino (browser-based CalDAV client) talks to Radicale directly from the
# browser, so it needs CORS headers on every response, including the
# preflight OPTIONS and auth-failure responses (Radicale applies these
# unconditionally). Scoped to calino's own origin rather than "*".
Access-Control-Allow-Origin = https://calendar.int.lab53.net
Access-Control-Allow-Methods = GET, POST, PUT, DELETE, PROPFIND, PROPPATCH, REPORT, OPTIONS, MKCOL, MKCALENDAR, COPY, MOVE
Access-Control-Allow-Headers = Authorization, Content-Type, Depth, Prefer, If-None-Match, If-Match
Access-Control-Expose-Headers = ETag, Location, DAV, Allow
