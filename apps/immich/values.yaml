controllers:
    main:
        containers:
            main:
                image:
                    repository: ghcr.io/immich-app/immich-server
                    tag: v2.7.5

immich:
    persistence:
        library:
            existingClaim: immich-library

server:
    ingress:
        main:
            enabled: false
    controllers:
        main:
            containers:
                main:
                    envFrom:
                        - secretRef:
                              name: immich-db
                    env:
                        DB_VECTOR_EXTENSION: vectorchord

machine-learning:
    enabled: true
    persistence:
        cache:
            enabled: true
            type: persistentVolumeClaim
            size: 10Gi
            storageClass: truenas-iscsi
            accessMode: ReadWriteOnce

valkey:
    enabled: true
    persistence:
        data:
            enabled: true
            type: persistentVolumeClaim
            size: 1Gi
            storageClass: truenas-iscsi
            accessMode: ReadWriteOnce
