---
# Rendered by the apprise ExternalSecret template.
# Templated placeholders come from AWS Secrets Manager.
version: 1
urls:
  - ? "pover://{{ .pushover_user_key }}@{{ .pushover_app_token }}\
      ?priority=normal"
    : - tag: info, push
  - ? "pover://{{ .pushover_user_key }}@{{ .pushover_app_token }}\
      ?priority=high"
    : - tag: warn, critical, push
  - ? "pover://{{ .pushover_user_key }}@{{ .pushover_app_token }}\
      ?priority=emergency&interval=300&expire=10800"
    : - tag: emergency, push
  - ? "ses://{{ .ses_from }}/{{ .ses_access_key_id }}/\
      {{ .ses_secret_access_key | urlquery }}/{{ .ses_region }}/{{ .ses_to }}"
    : - tag: critical, emergency, email
