provider:
    name: cloudflare

policy: sync
# Unchanged so TXT ownership records already in the zone are still recognised.
txtOwnerId: external-dns-ext-route53
sources: ["gateway-httproute"]
domainFilters: ["lab53.net"]
excludeDomains: ["int.lab53.net"]

env:
    - name: CF_API_TOKEN
      valueFrom:
          secretKeyRef:
              name: cloudflare-api-token
              key: api-token

extraArgs:
    cloudflare-proxied: true
    gateway-name: traefik-external
    gateway-namespace: traefik
